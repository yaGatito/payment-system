type Card {
  id: ID!
  type: String!
  linkedAt: Int!
  last4: String!
}

type WalletCard {
  redirectUrl: String!
}

type Payment {
  paymentId: ID!
  amount: Int!
  currency: String!
  status: String!
  createdAt: Int!
}

type PaymentResult {
  paymentId: ID!
  status: String!
  redirectUrl: String!
}

type Query {
  getCards(
    customerId: ID!
  ): [Card!]!

  getPayments(
    customerId: ID!
    limit: Int = 10
    offset: Int = 0
  ): [Payment!]!
}

type Mutation {
  addCardToWallet(
    customerId: ID!
  ): WalletCard!

  payWithCard(
    customerId: ID!
    cardId: ID!
    amount: Int!
    currency: String!
    orderId: ID!
  ): PaymentResult!
}
